name: Feature proposal
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should VPS Buddy solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Show the simplest user-facing command or interaction.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and maintenance considerations
      description: Include upstream ownership, privilege, network, privacy, and update implications.
    validations:
      required: true
