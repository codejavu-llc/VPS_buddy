name: Upstream Toolchain

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.build.outputs.go }}
      pipx: ${{ steps.build.outputs.pipx }}
      source: ${{ steps.build.outputs.source }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        name: Build validation matrices
        shell: bash
        run: |
          go_matrix=$(awk -F '|' '$1 !~ /^#/ && $4 == "go" {print $1 "\t" $5 "\t" $6}' manifests/tools.tsv | jq -Rsc 'split("\n") | map(select(length > 0) | split("\t") | {name: .[0], package: .[1], version: .[2]})')
          pipx_matrix=$(awk -F '|' '$1 !~ /^#/ && $4 == "pipx" {print $1 "\t" $5 "\t" $6}' manifests/tools.tsv | jq -Rsc 'split("\n") | map(select(length > 0) | split("\t") | {name: .[0], package: .[1], version: .[2]})')
          source_matrix=$(awk -F '|' '$1 !~ /^#/ && $4 == "source" {print $1 "\t" $5 "\t" $6}' manifests/tools.tsv | jq -Rsc 'split("\n") | map(select(length > 0) | split("\t") | {name: .[0], repository: .[1], version: .[2]})')
          echo "go=$go_matrix" >> "$GITHUB_OUTPUT"
          echo "pipx=$pipx_matrix" >> "$GITHUB_OUTPUT"
          echo "source=$source_matrix" >> "$GITHUB_OUTPUT"

  go-tools:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.go) }}
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build ${{ matrix.name }}
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install "${{ matrix.package }}@${{ matrix.version }}"
      - name: Verify executable
        run: test -x "${{ runner.temp }}/bin/${{ matrix.name }}"

  python-tools:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.pipx) }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pipx
        run: python -m pip install --disable-pip-version-check pipx
      - name: Install ${{ matrix.name }}
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          specification=$PACKAGE
          if [[ "$VERSION" != latest ]]; then
            specification+="==$VERSION"
          fi
          python -m pipx install "$specification"
      - name: Verify executable
        run: test -x "${{ runner.temp }}/bin/${{ matrix.name }}"

  source-tools:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.source) }}
    steps:
      - name: Install compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Build ${{ matrix.name }}
        run: |
          git clone --filter=blob:none --depth 1 --branch "${{ matrix.version }}" "${{ matrix.repository }}" source
          make -C source -j 2
          test -x "source/bin/${{ matrix.name }}"
